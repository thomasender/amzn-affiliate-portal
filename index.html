<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amazon Affiliate Link Generator</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #f6f7f9;
        padding: 40px;
      }

      .container {
        max-width: 520px;
        margin: auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 20px;
        margin-bottom: 16px;
        text-align: center;
      }

      input {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 12px;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border-radius: 8px;
        border: none;
        background: #ff9900;
        color: black;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #e68a00;
      }

      .output {
        margin-top: 16px;
        padding: 12px;
        background: #f1f3f5;
        border-radius: 8px;
        font-size: 14px;
        word-break: break-all;
      }

      .error {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Amazon Affiliate Link Generator</h1>

      <input
        id="urlInput"
        type="text"
        placeholder="Paste Amazon or amzn.eu link here"
      />

      <button onclick="generate()">Generate Affiliate Link</button>

      <div id="result" class="output"></div>
    </div>

    <script>
      const AFFILIATE_TAG = "blissofkundal-21";
      const ASIN_RE = /\/(?:dp|gp\/product)\/([A-Z0-9]{10})/;
      // Public CORS proxy, only used to expand short links (amzn.eu, amzn.to, a.co)
      const PROXY = "https://api.allorigins.win/get?url=";

      function fromUrl(u) {
        const m = u.pathname.match(ASIN_RE);
        return m ? { asin: m[1], host: u.hostname } : null;
      }

      async function expandShortLink(url) {
        const res = await fetch(PROXY + encodeURIComponent(url));
        if (!res.ok) throw new Error("Short link could not be expanded");
        const { contents } = await res.json();
        const canon = contents.match(
          /<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i,
        );
        const found = canon && fromUrl(new URL(canon[1]));
        if (!found) throw new Error("Could not extract ASIN from short link");
        return found;
      }

      async function generate() {
        let input = document.getElementById("urlInput").value.trim();
        const result = document.getElementById("result");
        result.textContent = "Working…";

        if (!input) {
          result.innerHTML = '<span class="error">Please enter a URL.</span>';
          return;
        }

        try {
          if (!/^https?:\/\//i.test(input)) input = "https://" + input;
          const url = new URL(input);
          let info = fromUrl(url);
          if (!info) info = await expandShortLink(input);

          const link = `https://${info.host}/dp/${info.asin}?tag=${AFFILIATE_TAG}`;
          result.innerHTML = `
      <strong>Affiliate link:</strong><br>
      <a href="${link}" target="_blank" rel="noopener">${link}</a>
    `;
        } catch (err) {
          result.innerHTML = `<span class="error">Error: ${err.message}</span>`;
        }
      }
    </script>
  </body>
</html>
